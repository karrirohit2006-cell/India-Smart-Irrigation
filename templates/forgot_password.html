<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Smart Irrigation Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --primary-green: #1b8e4f;
            --primary-dark: #0f5132;
            --primary-accent: #22c55e;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body.auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(8, 38, 19, 0.82), rgba(15, 60, 32, 0.78)),
                        url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            padding: 24px 16px;
            color: #fff;
            position: relative;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 2;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 13px;
            font-weight: 600;
            color: #dcfce7;
            margin-bottom: 12px;
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.4);
            color: var(--text-dark);
        }

        .card-heading {
            margin-bottom: 20px;
            text-align: left;
        }

        .card-heading h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-heading p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
            color: #64748b;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }

        .phone-otp-row {
            display: flex;
            gap: 8px;
        }

        .phone-otp-row .input-wrap {
            flex: 1;
        }

        .btn-inline-otp {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            padding: 0 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .btn-inline-otp:hover:not(:disabled) {
            background: #dcfce7;
            border-color: var(--primary-green);
            color: var(--primary-dark);
        }

        .otp-box-wrap {
            background: #f0fdf4;
            border: 1px dashed #86efac;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }

        .otp-box-wrap label {
            font-size: 12px;
            font-weight: 700;
            color: #166534;
            display: block;
            margin-bottom: 6px;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-green);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(27, 142, 79, 0.25);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .auth-alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 16px;
            display: none;
        }

        .auth-alert.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .auth-alert.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .auth-alert.info { background: #f0f9ff; color: #075985; border: 1px solid #bae6fd; }

        .card-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: #475569;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
        }

        .card-footer a {
            color: var(--primary-green);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <!-- Top Navigation: Compact 23-Language Selector, Global Speaker & Global Voice Mic -->
        <div class="auth-top-controls global-top-controls" id="globalTopControls">
            <div class="lang-selector-compact">
                <span class="globe-icon" aria-hidden="true">🌐</span>
                <select id="languageSelect" class="lang-selector" aria-label="Select Application Language">
                    <option value="en">English (English)</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="mr">मराठी (Marathi)</option>
                    <option value="gu">ગુજરાતી (Gujarati)</option>
                    <option value="kn">ಕನ್ನಡ (Kannada)</option>
                    <option value="ml">മലയാളം (Malayalam)</option>
                    <option value="or">ଓଡ଼ିଆ (Odia)</option>
                    <option value="as">অসমীয়া (Assamese)</option>
                    <option value="ur">اردو (Urdu)</option>
                    <option value="sa">संस्कृतम् (Sanskrit)</option>
                    <option value="ne">नेपाली (Nepali)</option>
                    <option value="kok">कोंकणी (Konkani)</option>
                    <option value="mai">मैथिली (Maithili)</option>
                    <option value="doi">डोगरी (Dogri)</option>
                    <option value="brx">बड़ो (Bodo)</option>
                    <option value="ks">کٲشُر (Kashmiri)</option>
                    <option value="sd">سنڌي (Sindhi)</option>
                    <option value="mni">মৈতৈলোন্ (Manipuri)</option>
                    <option value="sat">ᱥᱟᱱᱛᱟᱲᱤ (Santali)</option>
                </select>
            </div>

            <!-- Right side: Three separate icon-only buttons, aligned horizontally -->
            <div class="header-controls-right" id="headerControlsRight">
                <!-- 1. Speaker icon – Text-to-Speech ON/OFF -->
                <button type="button" id="btnAudioListen" class="header-icon-btn btn-top-control btn-circular-audio btn-speaker-read" aria-label="Speaker ON / OFF" title="Speaker ON - Click to read page content">
                    <span aria-hidden="true" class="speaker-icon">🔈</span>
                </button>

                <!-- 2. Pause icon – Pause/Resume speech -->
                <button type="button" id="btnAudioPause" class="header-icon-btn btn-top-control btn-circular-audio btn-speaker-pause" aria-label="Pause / Resume Speech" title="Pause / Resume" disabled>
                    <span aria-hidden="true" class="pause-icon">⏸️</span>
                </button>
                <button type="button" id="btnAudioMute" style="display:none;" aria-hidden="true" tabindex="-1"></button>

                <!-- 3. Microphone icon – Voice Assistant -->
                <div class="website-voice-assistant" id="websiteVoiceAssistant" title="Website Voice Control">
                    <button type="button" id="btnVoiceNavMic" class="header-icon-btn btn-top-control btn-circular-va btn-global-mic" aria-label="Control Website with Voice" title="Voice Control (Click once to record, click again to stop and execute)">
                        <span aria-hidden="true" class="mic-icon">🎙️</span>
                        <span class="mic-recording-pulse" id="vaRecordingDot" style="display:none;" aria-hidden="true"></span>
                    </button>
                    <span id="vaNavStatusPill" class="va-nav-status-pill" style="display:none;" aria-live="polite">Ready</span>
                    <span id="btnVoiceSpeakerToggle" style="display:none;" aria-hidden="true">
                        <span id="vaSpeakerIcon"></span><span id="vaSpeakerBadge"></span>
                    </span>
                    <span id="btnVoiceGuide" style="display: none;" aria-hidden="true"></span>
                    <span id="btnVoiceMic" style="display: none;" aria-hidden="true"></span>
                </div>
            </div>
        </div>

        <div class="brand-header">
            <div class="brand-badge">
                <span>🌱</span>
                <span data-i18n="tagline">Smart Irrigation Planner</span>
            </div>
            <h1 data-i18n="formTitle">Account Recovery</h1>
        </div>

        <div class="auth-card">
            <div class="card-heading">
                <h2><span>🔑</span> <span id="recoveryTitle">Reset Password</span></h2>
                <p id="recoverySubtitle">Verify your mobile number via OTP to set a new password</p>
            </div>

            <div id="resetAlert" class="auth-alert" role="alert"></div>

            <form id="formResetPassword">
                <div class="form-group">
                    <label class="form-label" for="resetPhone">Registered Mobile Number</label>
                    <div class="phone-otp-row">
                        <div class="input-wrap">
                            <span class="input-icon">📱</span>
                            <input type="tel" id="resetPhone" class="form-input" placeholder="10-digit number" maxlength="10" required>
                        </div>
                        <button type="button" id="btnSendResetOtp" class="btn-inline-otp">
                            Send OTP
                        </button>
                    </div>
                </div>

                <div id="resetOtpBox" class="otp-box-wrap">
                    <label for="resetOtp">Enter 6-Digit OTP Code *</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔢</span>
                        <input type="text" id="resetOtp" class="form-input" placeholder="6-digit code" maxlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="newPassword" data-i18n="passwordLabel">New Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="newPassword" class="form-input" placeholder="Min 6 characters" minlength="6" required data-i18n-placeholder="passwordPlaceholder">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmNewPassword" data-i18n="confirmPasswordLabel">Confirm New Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmNewPassword" class="form-input" placeholder="Re-enter password" minlength="6" required data-i18n-placeholder="confirmPasswordPlaceholder">
                    </div>
                </div>

                <button type="submit" id="btnSubmitReset" class="btn-submit">
                    Reset Password & Sign In
                </button>
            </form>

            <div class="card-footer">
                <span data-i18n="alreadyAccountPrompt">Remembered your password?</span> <a href="/" data-i18n="loginLink">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function showAlert(msg, type = "error") {
            const el = document.getElementById("resetAlert");
            el.className = `auth-alert ${type}`;
            el.textContent = msg;
            el.style.display = "block";
        }
        function hideAlert() {
            document.getElementById("resetAlert").style.display = "none";
        }

        const btnSendOtp = document.getElementById("btnSendResetOtp");
        const resetPhone = document.getElementById("resetPhone");
        const resetOtpBox = document.getElementById("resetOtpBox");

        btnSendOtp.addEventListener("click", async () => {
            hideAlert();
            const phone = resetPhone.value.trim();
            if (!/^\d{10}$/.test(phone)) {
                showAlert("Please enter your registered 10-digit mobile number.");
                return;
            }

            btnSendOtp.disabled = true;
            btnSendOtp.textContent = "Sending...";

            try {
                const res = await fetch("/api/auth/otp/send", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, purpose: "forgot_password" }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert(`Recovery code sent to ${phone}. (Demo code: ${data.otp_preview || "Sent via SMS"})`, "info");
                    resetOtpBox.style.display = "block";
                    resetPhone.readOnly = true;
                    btnSendOtp.textContent = "OTP Sent ✓";
                    if (data.otp_preview) {
                        document.getElementById("resetOtp").value = data.otp_preview;
                    }
                } else {
                    showAlert(data.error || "Could not send OTP code.");
                    btnSendOtp.disabled = false;
                    btnSendOtp.textContent = "Send OTP";
                }
            } catch (e) {
                showAlert("Network error sending recovery code.");
                btnSendOtp.disabled = false;
                btnSendOtp.textContent = "Send OTP";
            }
        });

        document.getElementById("formResetPassword").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const phone = resetPhone.value.trim();
            const otp = document.getElementById("resetOtp").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmNewPassword = document.getElementById("confirmNewPassword").value;
            const btnSubmit = document.getElementById("btnSubmitReset");

            if (!phone) { showAlert("Mobile number required."); return; }
            if (!otp || otp.length !== 6) { showAlert("Enter the 6-digit OTP code."); return; }
            if (newPassword.length < 6) { showAlert("Password must be at least 6 characters."); return; }
            if (newPassword !== confirmNewPassword) { showAlert("Passwords do not match."); return; }

            btnSubmit.disabled = true;
            btnSubmit.textContent = "Updating Password...";

            try {
                const res = await fetch("/api/auth/forgot-password/reset", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        phone,
                        otp,
                        new_password: newPassword,
                        confirm_password: confirmNewPassword,
                    }),
                });
                const data = await res.json();
                if (res.ok && data.status === "success") {
                    showAlert("Password reset successfully! Redirecting to login...", "success");
                    setTimeout(() => { window.location.href = "/"; }, 1000);
                } else {
                    showAlert(data.error || "Could not reset password.");
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Reset Password & Sign In";
                }
            } catch (err) {
                showAlert("Network error during password reset.");
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Reset Password & Sign In";
            }
        });
    </script>
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='voice_controller.js') }}"></script>
</body>
</html>
